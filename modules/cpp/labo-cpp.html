 "libre": "// Bac à sable : sans #include \"jeu.h\", c'est un programme console avec main()\n#include \"jeu.h\"\n\ndouble x = 240, y = 160, vx = 3, vy = 2;\n\nvoid update(double dt) {\n    x += vx; y += vy;\n    if (x < 20 || x > LARGEUR - 20) vx = -vx;\n    if (y < 20 || y > HAUTEUR - 20) vy = -vy;\n}\n\nvoid draw() {\n    effacer(\"#16182b\");\n    cercle(x, y, 20, \"gold\");\n    texte(\"Bac a sable C++\", 12, 12, 18, \"white\");\n}\n",
 "libreTexte": "<p>Écris ce que tu veux. S'il y a <code>#include \"jeu.h\"<\/code>, le jeu démarre ; sinon le programme s'exécute dans la console.<\/p><p class=\"lb-small\">Avec <code>#include \"jeu.h\"<\/code>, le jeu appelle <code>update(dt)<\/code> puis <code>draw()<\/code> 60 fois par seconde (pas de <code>main<\/code>). Fonctions : <code>effacer(c)<\/code>, <code>rect(x, y, l, h, c)<\/code>, <code>cercle(x, y, r, c)<\/code>, <code>ligne(…)<\/code>, <code>texte(t, x, y, taille, c)<\/code>, <code>touche(\"droite\")<\/code>, <code>toucheAppuyee(\"espace\")<\/code>, <code>clic()<\/code>, <code>sourisX()<\/code>, <code>hasard(a, b)<\/code>, <code>LARGEUR<\/code>, <code>HAUTEUR<\/code>.<\/p>"
